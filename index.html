<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0e1720"
  >

  <title>AI Assistant</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg: #ffffff;
      --secondary-bg: #f1f1f1;
      --section-bg: #ffffff;
      --text: #111111;
      --hint: #8e8e93;
      --link: #2481cc;
      --button: #2481cc;
      --button-text: #ffffff;
      --border: rgba(127, 127, 127, 0.18);
      --green: #16a34a;
      --red: #dc2626;
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    button,
    textarea {
      font: inherit;
    }

    /* ======================================================
       BROWSER BLOCK
       ====================================================== */

    #browserGuard {
      position: fixed;
      inset: 0;
      z-index: 999999;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background: #0e1720;
    }

    .guard-card {
      width: min(370px, calc(100% - 40px));
      padding: 30px 24px;

      text-align: center;

      background: #1c2a35;
      border-radius: 24px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .telegram-logo {
      width: 80px;
      height: 80px;

      margin: 0 auto 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;
      background: #229ed9;
    }

    .telegram-logo svg {
      width: 46px;
      height: 46px;
      fill: #ffffff;
    }

    .guard-title {
      margin: 0 0 12px;
      color: #ffffff;
      font-size: 24px;
      line-height: 1.2;
      font-weight: 800;
    }

    .guard-text {
      margin: 0 auto;
      max-width: 310px;

      color: #d7e0e7;
      font-size: 14px;
      line-height: 1.55;
    }

    /* ======================================================
       APP
       ====================================================== */

    #app {
      display: none;

      width: 100%;
      max-width: 760px;
      margin: 0 auto;

      padding:
        calc(14px + var(--tg-content-safe-area-inset-top, 0px))
        14px
        calc(24px + var(--tg-content-safe-area-inset-bottom, 0px));
    }

    /* ======================================================
       HEADER
       ====================================================== */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-icon {
      width: 46px;
      height: 46px;

      display: grid;
      place-items: center;

      border-radius: 14px;
      background: rgba(36, 129, 204, 0.12);

      font-size: 23px;
    }

    .brand-title {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
    }

    .brand-subtitle {
      margin: 3px 0 0;
      color: var(--hint);
      font-size: 12px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      padding: 7px 10px;
      border-radius: 999px;

      background: rgba(22, 163, 74, 0.1);
      color: var(--green);

      font-size: 12px;
      font-weight: 700;
    }

    .status-pill.listening {
      background: rgba(220, 38, 38, 0.1);
      color: var(--red);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    /* ======================================================
       CHAT
       ====================================================== */

    .chat-card {
      min-height: 55vh;

      background: var(--section-bg);

      border: 1px solid var(--border);
      border-radius: var(--radius);

      overflow: hidden;

      display: flex;
      flex-direction: column;
    }

    .messages {
      flex: 1;

      min-height: 350px;
      max-height: 62vh;

      overflow-y: auto;

      padding: 16px;

      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 88%;

      padding: 11px 13px;

      border-radius: 15px;

      font-size: 15px;
      line-height: 1.5;

      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.bot {
      align-self: flex-start;

      background: var(--secondary-bg);
      color: var(--text);

      border-bottom-left-radius: 5px;
    }

    .message.user {
      align-self: flex-end;

      background: var(--button);
      color: var(--button-text);

      border-bottom-right-radius: 5px;
    }

    .message.loading {
      opacity: 0.7;
    }

    .welcome {
      margin: auto;
      max-width: 330px;

      padding: 25px 10px;

      text-align: center;
      color: var(--hint);
    }

    .welcome-icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .welcome h2 {
      margin: 0 0 8px;

      color: var(--text);
      font-size: 20px;
    }

    .welcome p {
      margin: 0;

      font-size: 13px;
      line-height: 1.55;
    }

    /* ======================================================
       INPUT
       ====================================================== */

    .input-area {
      padding: 12px;

      border-top: 1px solid var(--border);
      background: var(--section-bg);
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 7px;
    }

    #messageInput {
      flex: 1;
      min-width: 0;

      min-height: 48px;
      max-height: 150px;

      padding: 13px 14px;

      resize: none;
      overflow-y: auto;

      border: 1px solid var(--border);
      border-radius: 15px;

      outline: none;

      background: var(--secondary-bg);
      color: var(--text);

      font-size: 16px;
      line-height: 1.4;
    }

    #messageInput::placeholder {
      color: var(--hint);
    }

    #messageInput:focus {
      border-color: var(--link);

      box-shadow:
        0 0 0 3px
        rgba(36, 129, 204, 0.12);
    }

    .input-button {
      width: 46px;
      height: 48px;

      flex: 0 0 46px;

      display: grid;
      place-items: center;

      border: none;
      border-radius: 14px;

      background: var(--secondary-bg);
      color: var(--text);

      font-size: 20px;

      cursor: pointer;
    }

    .input-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #micButton.listening {
      background: var(--red);
      color: #ffffff;

      animation: micPulse 1.3s infinite;
    }

    @keyframes micPulse {
      0% {
        box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.4);
      }

      70% {
        box-shadow: 0 0 0 12px rgba(220, 38, 38, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(220, 38, 38, 0);
      }
    }

    #sendButton {
      background: var(--button);
      color: var(--button-text);
    }

    .quick-actions {
      display: flex;

      gap: 7px;

      overflow-x: auto;

      padding-top: 9px;

      scrollbar-width: none;
    }

    .quick-actions::-webkit-scrollbar {
      display: none;
    }

    .quick-chip {
      flex: 0 0 auto;

      padding: 7px 10px;

      border: 1px solid var(--border);
      border-radius: 999px;

      background: var(--secondary-bg);
      color: var(--text);

      font-size: 12px;

      cursor: pointer;
    }

    /* ======================================================
       MESSAGE ACTIONS
       ====================================================== */

    .message-actions {
      display: flex;
      gap: 7px;
      margin-top: 8px;
    }

    .message-action {
      padding: 6px 9px;

      border: 1px solid var(--border);
      border-radius: 9px;

      background: var(--secondary-bg);
      color: var(--text);

      font-size: 11px;
      cursor: pointer;
    }

    /* ======================================================
       TOAST
       ====================================================== */

    #toast {
      position: fixed;

      left: 50%;

      bottom:
        calc(18px + var(--tg-content-safe-area-inset-bottom, 0px));

      z-index: 1000000;

      max-width: calc(100% - 28px);

      padding: 11px 14px;

      border-radius: 12px;

      background: #202124;
      color: #ffffff;

      font-size: 13px;
      text-align: center;

      opacity: 0;
      pointer-events: none;

      transform: translate(-50%, 20px);

      transition:
        opacity 0.2s ease,
        transform 0.2s ease;
    }

    #toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* ======================================================
       MOBILE
       ====================================================== */

    @media (max-width: 560px) {
      #app {
        padding-left: 10px;
        padding-right: 10px;
      }

      .status-pill {
        display: none;
      }

      .messages {
        max-height: 64vh;
      }

      .input-button {
        width: 44px;
        flex-basis: 44px;
      }
    }
  </style>
</head>

<body>

  <!-- ======================================================
       BROWSER ONLY
       ====================================================== -->

  <section id="browserGuard">

    <div class="guard-card">

      <div class="telegram-logo">

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M21.6 3.2c.3-1.2-.2-1.7-1.4-1.3L2.6 8.6c-1.2.4-1.2 1-.2 1.3l4.5 1.4 1.7 5.3c.2.7.4.8.9.8.4 0 .6-.2.9-.5l2.2-2.1 4.5 3.3c.8.4 1.4.2 1.6-.7l3.1-14.2ZM8.6 11l9.9-6.2-8.1 7.2-.3 3.1-1.5-4.1Z"
          />
        </svg>

      </div>

      <h1 class="guard-title">
        Open in Telegram
      </h1>

      <p class="guard-text">
        🤖 AI Assistant is a Telegram Mini App.
        Please open it from Telegram to use it.
      </p>

    </div>

  </section>


  <!-- ======================================================
       TELEGRAM APP
       ====================================================== -->

  <main id="app">

    <header class="header">

      <div class="brand">

        <div class="brand-icon">
          🤖
        </div>

        <div>

          <h1 class="brand-title">
            AI Assistant
          </h1>

          <p class="brand-subtitle">
            Ask, write, summarize and translate
          </p>

        </div>

      </div>


      <div
        id="statusPill"
        class="status-pill"
      >
        <span class="status-dot"></span>
        Ready
      </div>

    </header>


    <!-- CHAT -->

    <section class="chat-card">

      <div
        id="messages"
        class="messages"
      >

        <div
          id="welcome"
          class="welcome"
        >

          <div class="welcome-icon">
            🤖
          </div>

          <h2>
            How can I help?
          </h2>

          <p>
            Type a message or tap 🎤 to speak.
            I can answer questions, write,
            summarize, translate and brainstorm.
          </p>

        </div>

      </div>


      <!-- INPUT -->

      <div class="input-area">

        <div class="input-row">

          <textarea
            id="messageInput"
            rows="1"
            placeholder="Ask anything..."
            autocomplete="off"
            spellcheck="true"
          ></textarea>


          <button
            id="micButton"
            class="input-button"
            type="button"
            aria-label="Voice input"
            title="Voice input"
          >
            🎤
          </button>


          <button
            id="sendButton"
            class="input-button"
            type="button"
            aria-label="Send"
            title="Send"
            disabled
          >
            ➤
          </button>

        </div>


        <div class="quick-actions">

          <button
            class="quick-chip"
            type="button"
            data-prompt="Summarize this text in simple language:"
          >
            📝 Summarize
          </button>


          <button
            class="quick-chip"
            type="button"
            data-prompt="Rewrite this professionally:"
          >
            ✍️ Rewrite
          </button>


          <button
            class="quick-chip"
            type="button"
            data-prompt="Translate this to French:"
          >
            🌍 Translate
          </button>


          <button
            class="quick-chip"
            type="button"
            data-prompt="Give me 5 useful ideas for:"
          >
            💡 Ideas
          </button>

        </div>

      </div>

    </section>

  </main>


  <div id="toast"></div>


  <script>
    /* ========================================================
       CONFIG
       ======================================================== */

    const AI_ENDPOINT =
      "/.netlify/functions/chat";


    /* ========================================================
       TELEGRAM
       ======================================================== */

    const tg =
      window.Telegram?.WebApp || null;


    const browserGuard =
      document.getElementById(
        "browserGuard"
      );


    const app =
      document.getElementById(
        "app"
      );


    const initData =
      tg &&
      typeof tg.initData === "string"
        ? tg.initData.trim()
        : "";


    const isTelegramMiniApp =
      !!tg &&
      typeof tg.ready === "function" &&
      typeof tg.close === "function" &&
      initData.length > 0;


    if (!isTelegramMiniApp) {

      browserGuard.style.display =
        "flex";

      app.style.display =
        "none";

    } else {

      browserGuard.style.display =
        "none";

      app.style.display =
        "block";


      try {
        tg.ready();
      } catch (error) {
        console.warn(error);
      }


      try {
        tg.expand();
      } catch (error) {
        console.warn(error);
      }


      try {

        tg.BackButton.show();

        tg.BackButton.onClick(
          () => {
            tg.close();
          }
        );

      } catch (error) {

        console.warn(
          "Back button unavailable:",
          error
        );

      }

    }


    /* ========================================================
       THEME
       ======================================================== */

    function applyTelegramTheme() {

      if (!tg) {
        return;
      }


      const theme =
        tg.themeParams || {};


      const root =
        document.documentElement;


      const themeMap = {

        bg_color:
          "--bg",

        secondary_bg_color:
          "--secondary-bg",

        section_bg_color:
          "--section-bg",

        text_color:
          "--text",

        hint_color:
          "--hint",

        link_color:
          "--link",

        button_color:
          "--button",

        button_text_color:
          "--button-text"

      };


      Object.entries(
        themeMap
      ).forEach(
        ([telegramKey, cssKey]) => {

          if (
            theme[telegramKey]
          ) {

            root.style.setProperty(
              cssKey,
              theme[telegramKey]
            );

          }

        }
      );

    }


    if (isTelegramMiniApp) {

      applyTelegramTheme();


      try {

        tg.onEvent(
          "themeChanged",
          applyTelegramTheme
        );

      } catch (error) {

        console.warn(error);

      }

    }


    /* ========================================================
       ELEMENTS
       ======================================================== */

    const messages =
      document.getElementById(
        "messages"
      );


    const welcome =
      document.getElementById(
        "welcome"
      );


    const messageInput =
      document.getElementById(
        "messageInput"
      );


    const micButton =
      document.getElementById(
        "micButton"
      );


    const sendButton =
      document.getElementById(
        "sendButton"
      );


    const statusPill =
      document.getElementById(
        "statusPill"
      );


    const toast =
      document.getElementById(
        "toast"
      );


    let conversation = [];


    /* ========================================================
       TOAST
       ======================================================== */

    function showToast(message) {

      toast.textContent =
        message;

      toast.classList.add(
        "show"
      );

      clearTimeout(
        showToast.timer
      );

      showToast.timer =
        setTimeout(
          () => {

            toast.classList.remove(
              "show"
            );

          },
          2500
        );

    }


    /* ========================================================
       TEXTAREA
       ======================================================== */

    function resizeInput() {

      messageInput.style.height =
        "auto";


      messageInput.style.height =
        Math.min(
          messageInput.scrollHeight,
          150
        ) + "px";

    }


    messageInput.addEventListener(
      "input",
      () => {

        resizeInput();


        sendButton.disabled =
          messageInput.value.trim()
            .length === 0;

      }
    );


    /* ========================================================
       ADD USER MESSAGE
       ======================================================== */

    function addUserMessage(text) {

      if (
        welcome &&
        welcome.parentNode
      ) {

        welcome.remove();

      }


      const message =
        document.createElement(
          "div"
        );


      message.className =
        "message user";


      message.textContent =
        text;


      messages.appendChild(
        message
      );


      messages.scrollTop =
        messages.scrollHeight;

    }


    /* ========================================================
       ADD AI MESSAGE
       ======================================================== */

    function addBotMessage(text) {

      const wrapper =
        document.createElement(
          "div"
        );


      wrapper.style.maxWidth =
        "88%";


      wrapper.style.alignSelf =
        "flex-start";


      const message =
        document.createElement(
          "div"
        );


      message.className =
        "message bot";


      message.textContent =
        text;


      const actions =
        document.createElement(
          "div"
        );


      actions.className =
        "message-actions";


      const copy =
        document.createElement(
          "button"
        );


      copy.className =
        "message-action";


      copy.type =
        "button";


      copy.textContent =
        "📋 Copy";


      copy.addEventListener(
        "click",
        async () => {

          try {

            await navigator.clipboard.writeText(
              text
            );

            showToast(
              "Response copied."
            );

          } catch (error) {

            showToast(
              "Could not copy."
            );

          }

        }
      );


      const share =
        document.createElement(
          "button"
        );


      share.className =
        "message-action";


      share.type =
        "button";


      share.textContent =
        "📤 Share";


      share.addEventListener(
        "click",
        () => {

          const url =
            "https://t.me/share/url" +
            "?url=" +
            encodeURIComponent(
              window.location.href
            ) +
            "&text=" +
            encodeURIComponent(
              "🤖 AI Assistant\n\n" +
              text
            );


          try {

            tg.openTelegramLink(
              url
            );

          } catch (error) {

            window.location.href =
              url;

          }

        }
      );


      actions.appendChild(
        copy
      );


      actions.appendChild(
        share
      );


      wrapper.appendChild(
        message
      );


      wrapper.appendChild(
        actions
      );


      messages.appendChild(
        wrapper
      );


      messages.scrollTop =
        messages.scrollHeight;

    }


    /* ========================================================
       LOADING
       ======================================================== */

    function addLoading() {

      const loading =
        document.createElement(
          "div"
        );


      loading.className =
        "message bot loading";


      loading.textContent =
        "🤔 Thinking…";


      messages.appendChild(
        loading
      );


      messages.scrollTop =
        messages.scrollHeight;


      return loading;

    }


    /* ========================================================
       SEND TO GEMINI
       ======================================================== */

    async function sendMessage() {

      const text =
        messageInput.value.trim();


      if (!text) {
        return;
      }


      sendButton.disabled =
        true;


      micButton.disabled =
        true;


      messageInput.disabled =
        true;


      addUserMessage(
        text
      );


      messageInput.value =
        "";


      resizeInput();


      const loading =
        addLoading();


      conversation.push({
        role: "user",
        content: text
      });


      try {

        const response =
          await fetch(
            AI_ENDPOINT,
            {

              method:
                "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                message:
                  text,

                conversation:
                  conversation.slice(
                    -12
                  ),

                initData:
                  initData

              })

            }
          );


        let data = {};


        try {

          data =
            await response.json();

        } catch (error) {
          /* Ignore invalid JSON. */
        }


        if (!response.ok) {

          throw new Error(
            data.error ||
            "AI service error."
          );

        }


        if (
          typeof data.reply !==
          "string" ||
          !data.reply.trim()
        ) {

          throw new Error(
            "The AI returned an empty response."
          );

        }


        loading.remove();


        addBotMessage(
          data.reply
        );


        conversation.push({
          role: "assistant",
          content: data.reply
        });


      } catch (error) {

        console.error(
          "AI error:",
          error
        );


        loading.remove();


        addBotMessage(
          "⚠️ " +
          (
            error.message ||
            "I couldn't process that request."
          )
        );

      } finally {

        messageInput.disabled =
          false;


        micButton.disabled =
          false;


        sendButton.disabled =
          messageInput.value.trim()
            .length === 0;


        messageInput.focus();

      }

    }


    /* ========================================================
       SEND BUTTON
       ======================================================== */

    sendButton.addEventListener(
      "click",
      sendMessage
    );


    /* ========================================================
       ENTER TO SEND
       ======================================================== */

    messageInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /* ========================================================
       QUICK PROMPTS
       ======================================================== */

    document
      .querySelectorAll(
        ".quick-chip"
      )
      .forEach(
        (button) => {

          button.addEventListener(
            "click",
            () => {

              messageInput.value =
                (
                  button.dataset.prompt ||
                  ""
                ) + " ";


              resizeInput();


              sendButton.disabled =
                false;


              messageInput.focus();

            }
          );

        }
      );


    /* ========================================================
       VOICE RECOGNITION
       ======================================================== */

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    let recognition = null;

    let isListening = false;

    let voiceBaseText = "";


    if (SpeechRecognition) {

      recognition =
        new SpeechRecognition();


      recognition.continuous =
        false;


      recognition.interimResults =
        true;


      recognition.maxAlternatives =
        1;


      recognition.lang =
        "en-US";


      recognition.onstart =
        () => {

          isListening =
            true;


          voiceBaseText =
            messageInput.value.trim();


          micButton.classList.add(
            "listening"
          );


          micButton.textContent =
            "⏹";


          statusPill.classList.add(
            "listening"
          );


          statusPill.innerHTML =
            '<span class="status-dot"></span> Listening';


          messageInput.placeholder =
            "Speak now...";

        };


      recognition.onresult =
        (event) => {

          let interim =
            "";


          let finalText =
            "";


          for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
          ) {

            const result =
              event.results[i];


            const text =
              result[0].transcript;


            if (result.isFinal) {

              finalText +=
                text;

            } else {

              interim +=
                text;

            }

          }


          const prefix =
            voiceBaseText
              ? voiceBaseText +
                " "
              : "";


          messageInput.value =
            prefix +
            finalText +
            interim;


          resizeInput();


          sendButton.disabled =
            messageInput.value.trim()
              .length === 0;

        };


      recognition.onerror =
        (event) => {

          console.error(
            "Speech recognition error:",
            event.error
          );


          stopVoiceUI();


          if (
            event.error ===
            "not-allowed"
          ) {

            showToast(
              "Microphone permission was denied."
            );

          } else if (
            event.error ===
            "no-speech"
          ) {

            showToast(
              "No speech was detected."
            );

          } else if (
            event.error ===
            "network"
          ) {

            showToast(
              "Speech recognition needs a network connection."
            );

          } else {

            showToast(
              "Voice input could not start."
            );

          }

        };


      recognition.onend =
        () => {

          stopVoiceUI();

        };

    } else {

      /*
        Some Telegram devices/webviews do not expose
        SpeechRecognition.
      */

      micButton.disabled =
        true;


      micButton.title =
        "Voice input is not supported on this device";

    }


    /* ========================================================
       START / STOP VOICE
       ======================================================== */

    micButton.addEventListener(
      "click",
      () => {

        if (!recognition) {

          showToast(
            "Voice input is not supported on this device."
          );

          return;

        }


        if (isListening) {

          try {

            recognition.stop();

          } catch (error) {

            console.warn(error);

          }


          return;

        }


        try {

          recognition.lang =
            "en-US";


          recognition.start();

        } catch (error) {

          console.error(
            error
          );


          showToast(
            "Could not start voice input."
          );

        }

      }
    );


    function stopVoiceUI() {

      isListening =
        false;


      micButton.classList.remove(
        "listening"
      );


      micButton.textContent =
        "🎤";


      statusPill.classList.remove(
        "listening"
      );


      statusPill.innerHTML =
        '<span class="status-dot"></span> Ready';


      messageInput.placeholder =
        "Ask anything...";

    }


    /* ========================================================
       START
       ======================================================== */

    if (isTelegramMiniApp) {

      resizeInput();

    }

  </script>

</body>
</html>
